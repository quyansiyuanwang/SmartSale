name: Supabase development deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Supabase environment to deploy
        required: true
        default: development
        type: choice
        options: [development, production]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ai-chat --no-verify-jwt
          supabase functions deploy public-store --no-verify-jwt
          supabase functions deploy knowledge-search --no-verify-jwt
          supabase functions deploy ai-command
          supabase functions deploy knowledge-ingest
          supabase functions deploy onboarding
          supabase functions deploy import-products
      - name: Verify public API
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$VITE_SUPABASE_URL/functions/v1/public-store?slug=invalid-store" -H "apikey: $VITE_SUPABASE_ANON_KEY")"
          test "$status" = "404"
